ans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#101828">FILE_LOCK</text><rect x="1050" y="367" width="243.05560000000003" height="34" fill="#0E9384"/><text x="1465" y="393" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="end" fill="#0E9384">60.8%</text><text x="120" y="513" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#101828">SYNCHRONIZED</text><rect x="315" y="487" width="0" height="34" fill="#2563EB"/><text x="730" y="513" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="end" fill="#2563EB">0.0%</text><text x="855" y="513" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#101828">SYNCHRONIZED</text><rect x="1050" y="487" width="400" height="34" fill="#2563EB"/><text x="1435" y="513" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="end" fill="#FFFFFF">100.0%</text><text x="120" y="633" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#101828">OPTIMISTIC</text><rect x="315" y="607" width="0" height="34" fill="#7A5AF8"/><text x="730" y="633" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="end" fill="#7A5AF8">0.0%</text><text x="855" y="633" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#101828">OPTIMISTIC</text><rect x="1050" y="607" width="400" height="34" fill="#7A5AF8"/><text x="1435" y="633" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="end" fill="#FFFFFF">100.0%</text><text x="800" y="825" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#B42318">Lưu ý: throughput cao do fail-fast không đồng nghĩa xử lý đơn hàng tốt.</text></svg>